services:
  db:
    image: postgres:16-alpine
    container_name: gwent-db-dev
    environment:
      POSTGRES_DB: gwent
      POSTGRES_USER: gwent
      POSTGRES_PASSWORD: gwent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gwent"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gwent-redis-dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: gwent-api-dev
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://db:5432/gwent
      DB_USERNAME: gwent
      DB_PASSWORD: gwent
      JWT_SECRET: dev-secret-replace-in-prod-minimum-32-chars
      JWT_ACCESS_EXPIRATION_MS: 900000
      ALLOWED_ORIGINS: http://localhost:3000
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
