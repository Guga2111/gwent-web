spring:
  application:
    name: gwent-api
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:gwent-jwt-default-secret-key-for-local-dev}
  expiration-ms: ${JWT_EXPIRATION_MS:57600000}

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
