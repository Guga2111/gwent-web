spring:
  application:
    name: gwent-api
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:gwent-jwt-default-secret-key-for-local-dev}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  auth:
    capacity: ${RATE_LIMIT_AUTH_CAPACITY:10}
    refill-rate: ${RATE_LIMIT_AUTH_REFILL_RATE:1}
    refill-interval-ms: ${RATE_LIMIT_AUTH_REFILL_INTERVAL_MS:1000}
  public-tier:
    capacity: ${RATE_LIMIT_PUBLIC_CAPACITY:30}
    refill-rate: ${RATE_LIMIT_PUBLIC_REFILL_RATE:5}
    refill-interval-ms: ${RATE_LIMIT_PUBLIC_REFILL_INTERVAL_MS:1000}
  authenticated:
    capacity: ${RATE_LIMIT_AUTHENTICATED_CAPACITY:60}
    refill-rate: ${RATE_LIMIT_AUTHENTICATED_REFILL_RATE:10}
    refill-interval-ms: ${RATE_LIMIT_AUTHENTICATED_REFILL_INTERVAL_MS:1000}

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
