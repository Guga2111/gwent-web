name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run gwent-engine tests
        run: mvn test -pl gwent-engine --no-transfer-progress
        working-directory: backend

      # Uncomment once gwent-api module exists
      # - name: Run gwent-api tests
      #   run: mvn test -pl gwent-api -Dspring.profiles.active=test --no-transfer-progress
      #   working-directory: backend

  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gwent-api:latest
            ghcr.io/${{ github.repository_owner }}/gwent-api:${{ github.sha }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "Logging in to ghcr.io..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "Pulling latest image..."
            docker pull ghcr.io/${{ github.repository_owner }}/gwent-api:latest

            echo "Stopping old container..."
            docker stop gwent-api 2>/dev/null || true
            docker rm gwent-api 2>/dev/null || true

            echo "Starting new container..."
            docker run -d \
              --name gwent-api \
              --restart always \
              -p 8082:8080 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e DB_URL="${{ secrets.DB_URL }}" \
              -e DB_USERNAME="${{ secrets.DB_USERNAME }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e JWT_EXPIRATION_MS="${{ secrets.JWT_EXPIRATION_MS }}" \
              -e ALLOWED_ORIGINS="${{ secrets.ALLOWED_ORIGINS }}" \
              ghcr.io/${{ github.repository_owner }}/gwent-api:latest

            echo "Waiting for container to start..."
            sleep 10

            echo "Health check..."
            docker ps | grep gwent-api

            echo "Last 30 log lines:"
            docker logs --tail 30 gwent-api

            echo "Cleaning up old images..."
            docker image prune -f
