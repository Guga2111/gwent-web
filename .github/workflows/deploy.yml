name: CD - Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Um deploy de cada vez. Dois workflows a fazer `docker compose down`/`up -d` na
# mesma VPS ao mesmo tempo deixariam a producao num estado indefinido.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  tests:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to VPS
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://gwent.luisgosampaio.com

    env:
      VPS_IP: ${{ vars.VPS_IP || '31.97.169.38' }}
      VPS_USER: ${{ vars.VPS_USER || 'root' }}
      APP_URL: ${{ vars.APP_URL || 'https://gwent.luisgosampaio.com' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Configure SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy

          if [[ -n "${SSH_KNOWN_HOSTS}" ]]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$VPS_IP" >> ~/.ssh/known_hosts 2>/dev/null
          fi

          cat > ~/.ssh/config << EOF
          Host $VPS_IP
            User $VPS_USER
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
          EOF

      - name: Write .env from secrets
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION_MS: ${{ secrets.JWT_EXPIRATION_MS }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS || 'https://gwent.luisgosampaio.com' }}
          API_PORT: ${{ vars.API_PORT || '8084' }}
        run: |
          set -euo pipefail
          umask 077

          for var in DB_URL DB_USERNAME DB_PASSWORD JWT_SECRET JWT_EXPIRATION_MS; do
            if [[ -z "${!var}" ]]; then
              echo "Missing required secret: ${var}"
              echo "   Configure in Settings > Secrets and variables > Actions."
              exit 1
            fi
          done

          {
            printf 'DB_URL=%s\n' "$DB_URL"
            printf 'DB_USERNAME=%s\n' "$DB_USERNAME"
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'JWT_EXPIRATION_MS=%s\n' "$JWT_EXPIRATION_MS"
            printf 'ALLOWED_ORIGINS=%s\n' "$ALLOWED_ORIGINS"
            printf 'API_PORT=%s\n' "$API_PORT"
          } > .env

      - name: Run deploy.sh
        run: ./scripts/deploy.sh

      - name: Smoke test public health endpoint
        run: |
          set -uo pipefail
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 10 "${APP_URL}/api/health" > /dev/null 2>&1; then
              echo "Health check passed (attempt ${attempt})."
              exit 0
            fi
            echo "Not ready yet (attempt ${attempt}/12), retrying in 10s..."
            sleep 10
          done
          echo "API did not respond at ${APP_URL}/api/health after 2 minutes."
          exit 1

      - name: Clean up secrets from runner
        if: always()
        run: |
          shred -u .env ~/.ssh/id_deploy 2>/dev/null || rm -f .env ~/.ssh/id_deploy
