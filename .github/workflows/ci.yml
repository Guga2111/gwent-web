name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_call:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run gwent-engine tests
        run: mvn test -pl gwent-engine --no-transfer-progress
        working-directory: backend

      - name: Install parent POM and gwent-engine
        run: mvn install -pl .,gwent-engine -DskipTests --no-transfer-progress
        working-directory: backend

      - name: Run gwent-api tests
        run: mvn test -pl gwent-api -Dspring.profiles.active=test --no-transfer-progress
        working-directory: backend

  frontend:
    name: Frontend lint & tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend

      - name: Lint
        run: bun run lint
        working-directory: frontend

      - name: Type check
        run: tsc -b
        working-directory: frontend

      - name: Test
        run: bun run test
        working-directory: frontend