name: CI

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run gwent-engine tests
        run: mvn test -pl gwent-engine --no-transfer-progress
        working-directory: backend

      - name: Run gwent-api tests
        run: mvn test -pl gwent-api -Dspring.profiles.active=test --no-transfer-progress
        working-directory: backend
